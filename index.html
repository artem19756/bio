
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="Личная страница D0XMO">
<title>D0XMO — Personal Space</title>

<style>
:root {
  --bg: #080808;
  --glass: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.15);
  --text: #f5f5f5;
  --muted: #929292;
  --blur: 24px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
a { color:inherit; text-decoration:none; }
button,input { font:inherit; }

#background {
  position:fixed; inset:0; z-index:-3; overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 10%,#292929 0,transparent 42%),
    radial-gradient(ellipse at 90% 75%,#202020 0,transparent 38%),
    #080808;
}
.orb {
  position:absolute; width:320px; height:320px; border-radius:50%;
  background:rgba(220,220,220,.10);
  filter:blur(90px);
  animation:float 12s ease-in-out infinite alternate;
}
.orb.one { top:5%; left:-160px; }
.orb.two {
  right:-170px; bottom:5%; animation-delay:-5s;
  background:rgba(150,150,150,.12);
}
.grain {
  position:fixed; inset:0; pointer-events:none; z-index:10; opacity:.10;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}
.wrap { width:min(920px,100%); margin:auto; padding:26px 20px 45px; }
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:35px; animation:appear .8s both;
}
.brand { font-size:14px; letter-spacing:5px; font-weight:800; }
.status {
  display:flex; align-items:center; gap:8px; color:#bdbdbd;
  font-size:11px; letter-spacing:1px;
}
.dot {
  width:7px; height:7px; background:#ddd; border-radius:50%;
  box-shadow:0 0 12px #fff; animation:pulse 2s infinite;
}
.glass {
  position:relative; overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.095),rgba(255,255,255,.025));
  border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 25px 80px rgba(0,0,0,.24);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}
.hero {
  text-align:center; border-radius:30px; padding:45px 24px 38px;
  animation:appear .9s .1s both;
}
.avatar {
  width:112px; height:112px; margin:0 auto 24px; display:grid;
  place-items:center; border-radius:50%;
  border:1px solid rgba(255,255,255,.38);
  background:radial-gradient(circle at 30% 25%,#686868,#1a1a1a 65%);
  box-shadow:0 0 0 8px rgba(255,255,255,.025),0 0 45px rgba(255,255,255,.12);
  font-size:37px; font-weight:900; letter-spacing:-4px;
  animation:levitate 5s ease-in-out infinite;
}
.eyebrow {
  color:#a9a9a9; font-size:10px; letter-spacing:4px;
  text-transform:uppercase; margin-bottom:12px;
}
h1 { font-size:clamp(36px,8vw,64px); letter-spacing:-3px; font-weight:850; line-height:1.1; }
h1 span {
  background:linear-gradient(100deg,#fff,#777,#eee,#888);
  background-size:250% auto; color:transparent; background-clip:text;
  -webkit-background-clip:text; animation:shine 6s linear infinite;
}
.subtitle { color:var(--muted); font-size:14px; margin-top:15px; }
.pill {
  display:inline-flex; margin-top:24px; padding:10px 16px;
  border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.04);
  border-radius:50px; color:#ccc; font-size:11px; letter-spacing:1px;
}
.section-title {
  display:flex; align-items:center; justify-content:space-between;
  margin:32px 2px 14px;
}
.section-title h2 { font-size:12px; text-transform:uppercase; letter-spacing:3px; }
.section-title span { font-size:10px; color:#777; }
.socials { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
.social-card {
  display:flex; flex-direction:column; min-height:120px;
  justify-content:space-between; padding:20px; border-radius:20px;
  animation:appear .7s both;
  transition:transform .3s,border-color .3s,background .3s;
}
.social-card:nth-child(2) { animation-delay:.12s; }
.social-card:nth-child(3) { animation-delay:.24s; }
.social-card:hover {
  transform:translateY(-5px); border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.10);
}
.social-card:active { transform:scale(.97); }
.social-icon {
  width:35px; height:35px; display:grid; place-items:center;
  border:1px solid rgba(255,255,255,.17); background:rgba(255,255,255,.06);
  border-radius:12px; font-size:17px;
}
.social-name { font-size:14px; font-weight:700; margin-top:20px; }
.social-user { font-size:11px; color:#969696; margin-top:5px; }
.arrow { position:absolute; right:18px; top:18px; color:#aaa; font-size:15px; }

.music { border-radius:23px; padding:21px; animation:appear .8s .3s both; }
.track { display:flex; align-items:center; gap:14px; }
.album {
  width:53px; height:53px; flex-shrink:0; border-radius:16px;
  display:grid; place-items:center; background:linear-gradient(145deg,#555,#161616);
  border:1px solid #777; font-size:22px;
}
.track-info { flex:1; min-width:0; }
.track-title { font-size:13px; font-weight:700; overflow-wrap:anywhere; }
.track-subtitle { margin-top:5px; color:#888; font-size:11px; }
.play {
  border:1px solid rgba(255,255,255,.2); color:white;
  background:rgba(255,255,255,.1); width:43px; height:43px;
  border-radius:50%; cursor:pointer; transition:.25s;
}
.play:hover { background:rgba(255,255,255,.2); }
.play:active { transform:scale(.92); }
.progress { margin-top:20px; width:100%; accent-color:#ddd; cursor:pointer; }
.times { display:flex; justify-content:space-between; font-size:10px; color:#888; margin-top:6px; }
.upload {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  margin-top:15px; padding:10px 13px; border-radius:12px;
  border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04);
  color:#aaa; font-size:11px; cursor:pointer;
}
.upload:hover { color:white; }
.footer {
  text-align:center; padding:32px 0 0; color:#626262;
  font-size:10px; letter-spacing:2px; animation:appear 1s .4s both;
}
.footer strong { color:#aaa; }

@keyframes appear {
  from { opacity:0; transform:translateY(22px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes float {
  from { transform:translate(0,0) scale(1); }
  to { transform:translate(55px,45px) scale(1.18); }
}
@keyframes levitate {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-7px); }
}
@keyframes pulse {
  0%,100% { opacity:.55; box-shadow:0 0 5px #fff; }
  50% { opacity:1; box-shadow:0 0 15px #fff; }
}
@keyframes shine { to { background-position:250% center; } }

@media(max-width:600px) {
  :root { --blur:14px; }
  .wrap { padding:19px 14px 30px; }
  .topbar { margin-bottom:22px; }
  .hero { padding:35px 17px 30px; border-radius:25px; }
  .avatar { width:94px; height:94px; font-size:32px; }
  h1 { letter-spacing:-2px; }
  .socials { gap:8px; }
  .social-card { padding:13px 11px; min-height:115px; border-radius:17px; }
  .social-name { font-size:12px; }
  .social-user { font-size:10px; overflow-wrap:anywhere; }
  .arrow { top:10px; right:10px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important; transition:none !important; scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>
<div id="background">
  <div class="orb one"></div>
  <div class="orb two"></div>
</div>
<div class="grain"></div>

<div class="wrap">
  <header class="topbar">
    <div class="brand">D / X</div>
    <div class="status"><span class="dot"></span> PERSONAL SPACE</div>
  </header>

  <main>
    <section class="hero glass">
      <div class="avatar">DX</div>
      <div class="eyebrow">WELCOME TO MY SPACE</div>
      <h1><span>@D0XMO</span></h1>
      <p class="subtitle">Мой маленький уголок в интернете.</p>
      <div class="pill">✦ &nbsp; BLACK / SILVER / GLASS</div>
    </section>

    <div class="section-title">
      <h2>Мои соцсети</h2>
      <span>03 LINKS</span>
    </div>

    <section class="socials">
      <a class="social-card glass" href="https://t.me/d0xmo" target="_blank" rel="noopener noreferrer">
        <span class="arrow">↗</span>
        <span class="social-icon">✈</span>
        <div><div class="social-name">Telegram</div><div class="social-user">@d0xmo</div></div>
      </a>
      <a class="social-card glass" href="https://www.tiktok.com/@d0xmo" target="_blank" rel="noopener noreferrer">
        <span class="arrow">↗</span>
        <span class="social-icon">♪</span>
        <div><div class="social-name">TikTok</div><div class="social-user">@d0xmo</div></div>
      </a>
      <a class="social-card glass" href="https://github.com/artem19756" target="_blank" rel="noopener noreferrer">
        <span class="arrow">↗</span>
        <span class="social-icon">⌘</span>
        <div><div class="social-name">GitHub</div><div class="social-user">@artem19756</div></div>
      </a>
    </section>

    <div class="section-title">
      <h2>Музыка</h2>
      <span>MY SOUNDTRACK</span>
    </div>

    <section class="music glass">
      <div class="track">
        <div class="album">♫</div>
        <div class="track-info">
          <div class="track-title" id="track-title">Мой трек</div>
          <div class="track-subtitle" id="track-subtitle">Подключение музыки...</div>
        </div>
        <button class="play" id="play" aria-label="Воспроизвести">▶</button>
      </div>

      <input class="progress" id="progress" type="range" min="0" max="100" value="0" aria-label="Позиция трека">
      <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>

      <label class="upload">
        ＋ Выбрать другой MP3
        <input id="file" type="file" accept="audio/*" hidden>
      </label>

      <!-- Положи свой файл в папку music и назови track.mp3 -->
      <audio id="audio" loop preload="auto" src="music/track.mp3"></audio>
    </section>
  </main>

  <footer class="footer">MADE WITH <strong>✦</strong> BY D0XMO</footer>
</div>

<script>
const audio = document.getElementById("audio");
const play = document.getElementById("play");
const file = document.getElementById("file");
const progress = document.getElementById("progress");
const title = document.getElementById("track-title");
const subtitle = document.getElementById("track-subtitle");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

function clock(value) {
  if (!Number.isFinite(value)) return "0:00";
  const m = Math.floor(value / 60);
  const s = Math.floor(value % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

async function startMusic() {
  try {
    await audio.play();
    play.textContent = "Ⅱ";
    subtitle.textContent = "Сейчас играет • D0XMO";
  } catch {
    play.textContent = "▶";
    subtitle.textContent = "Нажми Play, чтобы включить музыку";
  }
}

// Автоматическая попытка запуска при открытии страницы
window.addEventListener("load", () => {
  startMusic();
});

play.addEventListener("click", async () => {
  if (audio.paused) {
    await startMusic();
  } else {
    audio.pause();
  }
});

file.addEventListener("change", async () => {
  const selected = file.files[0];
  if (!selected) return;

  audio.src = URL.createObjectURL(selected);
  title.textContent = selected.name.replace(/\.[^.]+$/, "");
  subtitle.textContent = "Загруженный трек";
  await startMusic();
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = clock(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  current.textContent = clock(audio.currentTime);
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = audio.currentTime / audio.duration * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = Number(progress.value) / 100 * audio.duration;
  }
});

audio.addEventListener("play", () => {
  play.textContent = "Ⅱ";
  subtitle.textContent = "Сейчас играет • D0XMO";
});

audio.addEventListener("pause", () => {
  play.textContent = "▶";
});

audio.addEventListener("error", () => {
  subtitle.textContent = "Добавь файл music/track.mp3";
});

title.textContent = "D0XMO — Track";
</script>
</body>
</html>
